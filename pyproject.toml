[project]
name = "acoustic-powder-monitoring"
version = "0.1.0"
description = "Analysis scripts for acoustic-emission-based monitoring of robotic powder grinding."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "joblib>=1.4.0",
    "matplotlib>=3.10.8",
    "numpy>=1.26.0,<2.2.0",
    "pandas>=2.3.3",
    "scienceplots>=2.2.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
]
